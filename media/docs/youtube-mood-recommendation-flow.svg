  <path d="M360 325h68M684 325h68M882 418v40H234v-40" fill="none" stroke="#475569" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M428 325l-26-18v36zM752 325l-26-18v36zM234 418l18 26h-36z" fill="#475569"/>
  <rect x="206" y="514" width="868" height="64" rx="18" fill="#f1f5f9"/>
  <text x="640" y="554" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#334155">The UI shows recommendations only after AI output becomes API search parameters.</text>
