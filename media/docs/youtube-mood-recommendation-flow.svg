<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">YouTube Mood recommendation flow</title>
  <desc id="desc">Frontend FastAPI and YouTube Data API flow</desc>
  <rect width="1280" height="720" fill="#fefce8"/>
  <rect x="78" y="88" width="1124" height="544" rx="42" fill="#ffffff"/>
  <text x="116" y="154" font-family="Arial, sans-serif" font-size="34" font-weight="800" fill="#1f2937">Recommendation Flow</text>
  <g font-family="Arial, sans-serif" font-weight="800" text-anchor="middle">
    <rect x="128" y="258" width="212" height="134" rx="24" fill="#1f2937"/>
    <text x="234" y="316" font-size="22" fill="#f9fafb">React UI</text>
    <text x="234" y="348" font-size="16" fill="#d1d5db">mood input</text>
    <rect x="452" y="258" width="212" height="134" rx="24" fill="#0f766e"/>
